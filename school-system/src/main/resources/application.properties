results.token.expiration=7d
# Historical archival is opt-in until R2 credentials and bucket are configured.
edunex.archive.enabled=${EDUNEX_ARCHIVE_ENABLED:false}
edunex.archive.cleanup.enabled=${EDUNEX_ARCHIVE_CLEANUP_ENABLED:false}
edunex.archive.r2.enabled=${EDUNEX_ARCHIVE_R2_ENABLED:false}
edunex.archive.r2.endpoint=${EDUNEX_ARCHIVE_R2_ENDPOINT:}
edunex.archive.r2.region=${EDUNEX_ARCHIVE_R2_REGION:auto}
edunex.archive.r2.bucket=${EDUNEX_ARCHIVE_R2_BUCKET:}
edunex.archive.r2.access-key=${EDUNEX_ARCHIVE_R2_ACCESS_KEY:}
edunex.archive.r2.secret-key=${EDUNEX_ARCHIVE_R2_SECRET_KEY:}
edunex.archive.worker.batch-size=${EDUNEX_ARCHIVE_WORKER_BATCH_SIZE:2}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
