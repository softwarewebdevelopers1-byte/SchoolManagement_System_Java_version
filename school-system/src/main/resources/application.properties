spring.application.name=demo
spring.config.import=optional:file:.env[.properties]
server.port=8000
# database location
# database location
spring.datasource.url=jdbc:mysql://${TIDB_HOST}:${TIDB_PORT}/${TIDB_NAME}?useSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 1. Test connections before handing them to Spring/Hibernate
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000

# 2. Force connections to recycle before TiDB closes them (set to ~4-5 minutes)
spring.datasource.hikari.max-lifetime=240000

# 3. Drop idle connections faster (set to 2-3 minutes)
spring.datasource.hikari.idle-timeout=120000

# 4. Set a minimum idle connection count
spring.datasource.hikari.minimum-idle=2
