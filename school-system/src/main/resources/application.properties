spring.application.name=demo
spring.config.import=optional:file:.env[.properties]
frontend.url=${FRONTEND_URL:http://localhost:8080}
server.port=8000
# database location
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${MYSQL_DATABASE:school_system}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
# MYSQL username
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:school_user}}
# MYSQL password
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Recycle connections before TiDB closes them.
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.minimum-idle=2
# Automatically creates/update tables
    # 1. create option destroys previous schemas and data and adds new ones when application is started, this is used only during development
    # 2. create-drop option creates a schema and destroys it when application is stopped
    # 3. none option disables DDL(Data Defination Language)
    # 4. update option creates schema if it is not there updates schema if there are changes made
    # 5. 
spring.jpa.hibernate.ddl-auto=update
# show sql queries in the console
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

