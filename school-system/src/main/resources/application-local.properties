# Local development overrides.
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Values come from the root .env, which application.properties imports.

spring.datasource.url=jdbc:mysql://${LOCAL_DB:localhost}:${LOCAL_PORT:3306}/${LOCAL_DB_NAME:school_database}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${LOCAL_DB_USERNAME:root}
spring.datasource.password=${LOCAL_DB_PASSWORD:}

# Local frontend dev server
frontend.url=http://localhost:5173