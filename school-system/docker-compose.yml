services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-school_system}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8000"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-school_system}
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:mysql://${DB_HOST:-db}:${DB_PORT:-3306}/${MYSQL_DATABASE:-school_system}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:?Set MYSQL_USER in .env}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RESULTS_TOKEN_ENCRYPTION_KEY: ${RESULTS_TOKEN_ENCRYPTION_KEY:-${JWT_SECRET:?Set JWT_SECRET in .env}}
      EDUNEX_ARCHIVE_ENABLED: ${EDUNEX_ARCHIVE_ENABLED:-false}
      EDUNEX_ARCHIVE_CLEANUP_ENABLED: ${EDUNEX_ARCHIVE_CLEANUP_ENABLED:-false}
      EDUNEX_ARCHIVE_R2_ENABLED: ${EDUNEX_ARCHIVE_R2_ENABLED:-false}
      EDUNEX_ARCHIVE_R2_ENDPOINT: ${EDUNEX_ARCHIVE_R2_ENDPOINT:-}
      EDUNEX_ARCHIVE_R2_REGION: ${EDUNEX_ARCHIVE_R2_REGION:-auto}
      EDUNEX_ARCHIVE_R2_BUCKET: ${EDUNEX_ARCHIVE_R2_BUCKET:-}
      EDUNEX_ARCHIVE_R2_ACCESS_KEY: ${EDUNEX_ARCHIVE_R2_ACCESS_KEY:-}
      EDUNEX_ARCHIVE_R2_SECRET_KEY: ${EDUNEX_ARCHIVE_R2_SECRET_KEY:-}
      EDUNEX_ARCHIVE_WORKER_BATCH_SIZE: ${EDUNEX_ARCHIVE_WORKER_BATCH_SIZE:-2}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      TEXTBEE_API_KEY: ${TEXTBEE_API_KEY:-}
      TEXTBEE_DEVICE_ID: ${TEXTBEE_DEVICE_ID:-}
      MOBITECH_API_KEY: ${MOBITECH_API_KEY:-}
      MOBITECH_SENDER_NAME: ${MOBITECH_SENDER_NAME:-}
      MOBITECH_SERVICE_ID: ${MOBITECH_SERVICE_ID:-0}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
